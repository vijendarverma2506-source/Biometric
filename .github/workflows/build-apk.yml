name: Build Biometric APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Biometric Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f Android.zip
          unzip -t Android.zip
          mkdir -p AndroidBuild
          unzip -q Android.zip -d AndroidBuild

          if [ -f "AndroidBuild/Android/settings.gradle" ]; then
            PROJECT_DIR="AndroidBuild/Android"
          elif [ -f "AndroidBuild/settings.gradle" ]; then
            PROJECT_DIR="AndroidBuild"
          else
            echo "Could not find settings.gradle in Android.zip"
            find AndroidBuild -maxdepth 3 -name settings.gradle -print
            exit 1
          fi

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android@v3 here.
      # GitHub ubuntu-latest runners provide the Android SDK.
      # Avoid sdkmanager's obsolete "tools" package request.
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms" ]; then
            ls -la "$ANDROID_HOME/platforms"
          else
            echo "Android SDK platforms directory is missing"
            exit 1
          fi

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-delay 5 --retry-all-errors \
            "https://downloads.gradle.org/distributions/gradle-8.9-bin.zip" \
            --output "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Build Biometric APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          mkdir -p output
          cp "$APK_PATH" output/Biometric.apk
          ls -lh output/Biometric.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biometric-APK
          path: output/Biometric.apk
          if-no-files-found: error
          retention-days: 30
